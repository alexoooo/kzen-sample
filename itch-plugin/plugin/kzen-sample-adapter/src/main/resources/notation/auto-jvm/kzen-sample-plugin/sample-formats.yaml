# The sample plugin's record formats, registered as graph objects of the host's ConfiguredRecordFormat archetype
# (bundled notation: merged into every workspace this plugin folder is installed in). Each names its reader by
# class; the reader itself is discovered through META-INF/services. Automatic chooses a format by the file
# name's extension (and gzip by a .gz suffix), never by its content.

# NASDAQ TotalView-ITCH 5.0: a binary feed of length-prefixed messages, named .itch or .nasdaq_itch50; a .gz
# name reads through the host's gzip content coding. The attributes are the reader's config: symbols and
# message types to admit (empty = all) and a time-of-day window in nanoseconds since midnight (blank = open).
ItchFormat:
  abstract: true
  is: ConfiguredRecordFormat
  class: tech.kzen.sample.plugin.itch.ItchFormat
  title: "NASDAQ ITCH 5.0"
  extensions:
    - itch
    - nasdaq_itch50
  catalogVisible: true
  symbols: []
  messageTypes: []
  fromNanos: ""
  toNanos: ""
  meta:
    symbols:
      is: List
      of: String
    messageTypes:
      is: List
      of: String
    fromNanos: String
    toNanos: String

ItchDay:
  is: ItchFormat
  title: "NASDAQ ITCH 5.0 day"


# The world-cities population file: no configuration and no extension (it is a .txt), so it is selected
# explicitly.
WorldCitiesFormat:
  abstract: true
  is: ConfiguredRecordFormat
  class: tech.kzen.sample.plugin.cities.WorldCitiesFormat
  title: "World cities population"
  extensions: []
  catalogVisible: true

WorldCities:
  is: WorldCitiesFormat
