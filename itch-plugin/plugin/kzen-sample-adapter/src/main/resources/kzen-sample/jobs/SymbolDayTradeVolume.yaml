# Canonical store-backed route: the day file is read once into the persistent locate-partitioned store under
# data/kzen-sample (built when absent or stale, never touching the source), and each complete symbol-day is
# materialized as one owned element — the run closes it once the Worker is done (E9) — from which the plugin's
# Worker reads the standing trades. The unlimited budget: an expression has no host to receive one from.
main:
  is: Job

main.workers/SymbolDays:
  is: FormulaSourceWorker
  code: 'tech.kzen.sample.itch.day.SymbolDays.of(tech.kzen.sample.itch.store.ItchDataArea(java.nio.file.Path.of("data/kzen-sample")).ensureStore(java.nio.file.Path.of("data/kzen-sample/synthetic-day.itch"), tech.kzen.sample.itch.store.ItchStoreBuilder()))'

main.workers/TradeVolume:
  is: SymbolDayTradeVolumeWorker

main.workers/Preview:
  is: PreviewWorker
